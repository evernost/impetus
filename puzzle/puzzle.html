<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grid</title>
<style>
  :root{
    --bg: #f2f3f5;
    --panel: #ffffff;
    --border: #dfe2e7;
    --border-strong: #c6cad2;
    --text: #1c2130;
    --text-dim: #6b7280;
    --accent: #3457e6;
    --accent-soft: #e8ecff;
    --cell-size: 26px;
    --font-ui: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 60px;
    min-height: 100vh;
  }

  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0 0 18px;
    color: var(--text);
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 18px;
    font-size: 13px;
  }

  .field { display: flex; align-items: center; gap: 6px; }
  .field label { color: var(--text-dim); }
  .field input[type=number] {
    width: 56px;
    padding: 4px 6px;
    border: 1px solid var(--border-strong);
    border-radius: 5px;
    font: inherit;
    font-family: var(--font-mono);
  }

  button {
    font: inherit;
    font-size: 13px;
    border: 1px solid var(--border-strong);
    background: var(--panel);
    color: var(--text);
    padding: 5px 12px;
    border-radius: 5px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:active { background: var(--accent-soft); }

  .grid-wrap {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 8px;
    padding: 12px;
    overflow: auto;
    max-width: 94vw;
    max-height: 74vh;
  }

  .grid {
    display: grid;
    border-left: 1px solid var(--border);
    border-top: 1px solid var(--border);
    width: max-content;
  }

  .cell {
    width: var(--cell-size);
    height: var(--cell-size);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: calc(var(--cell-size) * 0.42);
    color: var(--text);
    cursor: pointer;
    user-select: none;
    position: relative;
  }

  .cell:hover { background: #f7f8fa; }

  .cell.selected {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    background: var(--accent-soft);
    z-index: 1;
  }

  .status {
    margin-top: 14px;
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    height: 16px;
  }

  .hint {
    margin-top: 4px;
    font-size: 11px;
    color: var(--text-dim);
  }
</style>
</head>
<body>

<h1>Grid</h1>

<div class="toolbar">
  <div class="field">
    <label for="rowsInput">rows</label>
    <input id="rowsInput" type="number" min="1" max="200" value="50">
  </div>
  <div class="field">
    <label for="colsInput">cols</label>
    <input id="colsInput" type="number" min="1" max="200" value="50">
  </div>
  <button id="applySize">Apply size</button>
  <button id="clearAll">Clear all</button>
  <button id="demoFill">Demo fill</button>
</div>

<div class="grid-wrap">
  <div id="grid" class="grid"></div>
</div>

<div class="status" id="status"></div>
<div class="hint">Click a cell, then type a digit (0–9) or scroll the mouse wheel over it. Backspace/Delete clears it. Arrow keys move the selection. Escape deselects.</div>

<script>
/* ============================================================
   Grid — minimal API for a rectangular grid of numeric cells
   ============================================================

   const grid = new Grid({
     rows: 50,
     cols: 50,
     container: document.getElementById('grid'),
     cellSize: 26,          // optional, px
   });

   grid.get(row, col)              -> number (0-9) or null if empty
   grid.set(row, col, value)       -> value is 0-9 or null to clear
   grid.clear(row, col)            -> same as set(row, col, null)
   grid.clearAll()
   grid.getColor(row, col)         -> CSS color string or null
   grid.setColor(row, col, color)  -> color is any CSS color, or null to reset
   grid.resize(rows, cols)         -> keeps existing data that still fits
   grid.rows / grid.cols           -> current dimensions
   grid.values()                   -> full 2D array snapshot [row][col]

   const unsubscribe = grid.onChange((row, col, value, oldValue) => { ... });
   unsubscribe();  // stop listening

   Cell selection / keyboard / wheel editing is built in and needs
   no extra wiring — it's handled internally by the class.
   ============================================================ */

class Grid {
  constructor({ rows, cols, container, cellSize = 26 }) {
    this.container = container;
    this.cellSize = cellSize;
    this._changeListeners = [];
    this._selected = null; // {row, col} or null

    this._values = [];
    this._colors = [];
    this._cellEls = [];

    this._buildDom(rows, cols);
    this._bindEvents();
  }

  // ---------- public API ----------

  get(row, col) {
    this._assertInBounds(row, col);
    return this._values[row][col];
  }

  set(row, col, value) {
    this._assertInBounds(row, col);
    if (value !== null) {
      value = Math.trunc(value);
      if (value < 0 || value > 9 || Number.isNaN(value)) {
        throw new RangeError("Grid.set: value must be an integer 0-9, or null");
      }
    }
    const old = this._values[row][col];
    if (old === value) return;
    this._values[row][col] = value;
    this._renderCellValue(row, col);
    this._emitChange(row, col, value, old);
  }

  clear(row, col) {
    this.set(row, col, null);
  }

  clearAll() {
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        this.clear(r, c);
      }
    }
  }

  getColor(row, col) {
    this._assertInBounds(row, col);
    return this._colors[row][col];
  }

  setColor(row, col, color) {
    this._assertInBounds(row, col);
    this._colors[row][col] = color;
    const el = this._cellEls[row][col];
    el.style.background = color || "";
  }

  resize(rows, cols) {
    const oldValues = this._values;
    const oldColors = this._colors;
    this._buildDom(rows, cols);
    for (let r = 0; r < Math.min(rows, oldValues.length); r++) {
      for (let c = 0; c < Math.min(cols, oldValues[0]?.length || 0); c++) {
        if (oldValues[r][c] !== null) this.set(r, c, oldValues[r][c]);
        if (oldColors[r][c]) this.setColor(r, c, oldColors[r][c]);
      }
    }
    this._selected = null;
  }

  values() {
    return this._values.map(row => row.slice());
  }

  onChange(callback) {
    this._changeListeners.push(callback);
    return () => {
      this._changeListeners = this._changeListeners.filter(cb => cb !== callback);
    };
  }

  // ---------- internal ----------

  _assertInBounds(row, col) {
    if (row < 0 || row >= this.rows || col < 0 || col >= this.cols) {
      throw new RangeError(`Grid: (${row}, ${col}) is out of bounds`);
    }
  }

  _emitChange(row, col, value, old) {
    for (const cb of this._changeListeners) cb(row, col, value, old);
  }

  _buildDom(rows, cols) {
    this.rows = rows;
    this.cols = cols;
    this.container.innerHTML = "";
    this.container.style.gridTemplateColumns = `repeat(${cols}, ${this.cellSize}px)`;
    this.container.style.setProperty("--cell-size", `${this.cellSize}px`);

    this._values = [];
    this._colors = [];
    this._cellEls = [];

    for (let r = 0; r < rows; r++) {
      const valueRow = [];
      const colorRow = [];
      const elRow = [];
      for (let c = 0; c < cols; c++) {
        const el = document.createElement("div");
        el.className = "cell";
        el.dataset.row = r;
        el.dataset.col = c;
        this.container.appendChild(el);
        valueRow.push(null);
        colorRow.push(null);
        elRow.push(el);
      }
      this._values.push(valueRow);
      this._colors.push(colorRow);
      this._cellEls.push(elRow);
    }
  }

  _renderCellValue(row, col) {
    const el = this._cellEls[row][col];
    const v = this._values[row][col];
    el.textContent = v === null ? "" : String(v);
  }

  _select(row, col) {
    if (this._selected) {
      const prev = this._cellEls[this._selected.row][this._selected.col];
      prev.classList.remove("selected");
    }
    this._selected = { row, col };
    this._cellEls[row][col].classList.add("selected");
    this._onSelectionChange?.(row, col);
  }

  _deselect() {
    if (!this._selected) return;
    this._cellEls[this._selected.row][this._selected.col].classList.remove("selected");
    this._selected = null;
    this._onSelectionChange?.(null, null);
  }

  _bindEvents() {
    this.container.addEventListener("click", (e) => {
      const cellEl = e.target.closest(".cell");
      if (!cellEl) return;
      this._select(Number(cellEl.dataset.row), Number(cellEl.dataset.col));
    });

    document.addEventListener("keydown", (e) => {
      if (!this._selected) return;
      const { row, col } = this._selected;

      if (e.key >= "0" && e.key <= "9") {
        this.set(row, col, Number(e.key));
        e.preventDefault();
        return;
      }
      if (e.key === "Backspace" || e.key === "Delete") {
        this.clear(row, col);
        e.preventDefault();
        return;
      }
      if (e.key === "Escape") {
        this._deselect();
        e.preventDefault();
        return;
      }
      const moves = {
        ArrowUp: [-1, 0], ArrowDown: [1, 0],
        ArrowLeft: [0, -1], ArrowRight: [0, 1],
      };
      if (moves[e.key]) {
        const [dr, dc] = moves[e.key];
        const nr = Math.min(Math.max(row + dr, 0), this.rows - 1);
        const nc = Math.min(Math.max(col + dc, 0), this.cols - 1);
        this._select(nr, nc);
        e.preventDefault();
      }
    });

    document.addEventListener("wheel", (e) => {
      if (!this._selected) return;
      const cellEl = e.target.closest(".cell");
      // only react when the wheel happens over the currently selected cell
      if (!cellEl) return;
      const { row, col } = this._selected;
      if (Number(cellEl.dataset.row) !== row || Number(cellEl.dataset.col) !== col) return;

      e.preventDefault();
      const current = this._values[row][col] ?? 0;
      const delta = e.deltaY > 0 ? -1 : 1;
      const next = ((current + delta) % 10 + 10) % 10;
      this.set(row, col, next);
    }, { passive: false });
  }
}

// ============================================================
// Demo wiring below — not part of the Grid API itself
// ============================================================

const gridEl = document.getElementById("grid");
const statusEl = document.getElementById("status");

let grid = new Grid({ rows: 50, cols: 50, container: gridEl, cellSize: 26 });

grid.onChange((row, col, value, old) => {
  statusEl.textContent = `(${row}, ${col})  ${old ?? "·"} → ${value ?? "·"}`;
});

document.getElementById("applySize").addEventListener("click", () => {
  const rows = Math.max(1, Number(document.getElementById("rowsInput").value) || 1);
  const cols = Math.max(1, Number(document.getElementById("colsInput").value) || 1);
  grid.resize(rows, cols);
});

document.getElementById("clearAll").addEventListener("click", () => grid.clearAll());

document.getElementById("demoFill").addEventListener("click", () => {
  // small example of the API: diagonal values + a color gradient
  for (let r = 0; r < grid.rows; r++) {
    for (let c = 0; c < grid.cols; c++) {
      if (r === c) grid.set(r, c, (r + c) % 10);
      const t = (r + c) / (grid.rows + grid.cols);
      const hue = Math.round(210 - t * 60);
      if (r === c) grid.setColor(r, c, `hsl(${hue}, 70%, 92%)`);
    }
  }
});
</script>
</body>
</html>
